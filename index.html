<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4a2825"><title>你的理想恋爱剧本</title><style>
:root{--wine:#632e32;--brown:#4a302b;--cream:#f7efe2;--gold:#b98b62}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 10%,#7b4945,transparent 42%),linear-gradient(150deg,#2b2021,#4a302b);color:var(--cream);font-family:"Noto Serif SC","Songti SC",serif;min-height:100vh}.shell{width:min(100%,720px);margin:auto;padding:18px}.frame{min-height:calc(100vh - 36px);border:1px solid #b98b6266;background:linear-gradient(#3b2929e8,#342525f2);box-shadow:0 22px 70px #160d0d77;padding:clamp(26px,7vw,58px);position:relative;overflow:hidden}.frame:before{content:"";position:absolute;inset:12px;border:1px solid #b98b622c;pointer-events:none}.content{position:relative;z-index:1}.eyebrow{font-size:12px;letter-spacing:.35em;color:#d8af86}.hero{font-size:clamp(42px,10vw,76px);line-height:1.25;margin:55px 0 20px;font-weight:500}.subtitle{line-height:2;color:#e2cfc0}.rule{width:55px;height:1px;background:var(--gold);margin:32px 0}.button{background:var(--wine);color:var(--cream);border:1px solid var(--gold);padding:15px 27px;font:inherit;letter-spacing:.15em;cursor:pointer;min-height:52px}.button:hover,.button:focus-visible{background:#87444a}.secondary{background:transparent}.footer{font-size:12px;color:#bda79a;line-height:1.8;margin-top:35px}.top{display:flex;justify-content:space-between;gap:10px;color:#d8af86;font-size:13px;letter-spacing:.1em}.track{height:3px;background:#b98b6233;margin:18px 0 55px}.bar{height:100%;background:#d6a679;transition:width .4s}.question{font-size:clamp(25px,5vw,36px);line-height:1.55;font-weight:500;margin:16px 0 36px}.options{display:grid;gap:12px}.option{width:100%;display:flex;gap:16px;align-items:baseline;text-align:left;color:var(--cream);background:#fff7ed0b;border:1px solid #c49c7659;padding:17px 18px;line-height:1.65;font:inherit;cursor:pointer;transition:.2s}.option:hover,.option:focus-visible{background:#a25d4b46;transform:translateX(3px)}.letter{color:#d6a679}.nav{margin-top:34px}.fade{animation:fade .42s ease both}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.result{max-width:560px;margin:auto}.result .eyebrow{text-align:center}.result h1{text-align:center;font-size:clamp(39px,9vw,63px);font-weight:500;margin:26px 0 12px}.tagline{text-align:center;font-size:20px;line-height:1.8;color:#e8ba98}.result hr{border:0;border-top:1px solid #b98b6260;margin:32px 0}.section{margin:28px 0}.section h2{color:#d6a679;font-size:14px;letter-spacing:.24em;font-weight:400}.section p{font-size:16px;line-height:2;margin:9px 0}.acts p{padding-left:16px;border-left:1px solid #b98b6288}.line{font-size:22px!important;text-align:center;color:#efd0b6}.actions{text-align:center;margin:38px 0 10px}@media(max-width:520px){.shell{padding:0}.frame{min-height:100vh;padding:28px 25px}.hero{margin-top:80px}.track{margin-bottom:48px}}
</style></head><body><main class="shell"><div class="frame"><div class="content" id="app"></div></div></main><script>
const dims=['浪漫度','稳定度','戏剧性','日常感','独立度','成长性','安全感'];
const questions=[
['第一幕 · 心动','如果心动发生在一个普通傍晚，你更希望它像什么？',['对方记得你随口说过的小事','一场意料之外的重逢','两个人同时欲言又止','一起把难题解决后的相视一笑']],
['第一幕 · 心动','有人走进你的生活，你最先留意到什么？',['相处时不必费力的安心','眼神里藏不住的故事','彼此都在悄悄靠近','对方认真对待自己热爱的事']],
['第一幕 · 心动','理想中的第一次单独见面在哪里？',['熟悉街角的小店','雨后的旧车站','灯光刚亮起的书店','去看一场共同期待的展']],
['第一幕 · 心动','你最想收到哪种“我想你了”？',['一碗留给你的热汤','一封迟来的长信','一条打了又删的消息','一句“周末一起去实现那个计划”']],
['第一幕 · 心动','面对若有若无的好感，你会期待？',['慢慢成为彼此的习惯','一次坦诚的转折','某天发现原来一直双向奔赴','先做很合拍的伙伴']],
['第二幕 · 靠近','哪种告白方式最打动你？',['在熟悉的路上自然说出口','把曾经错过的话补全','承认那些藏了很久的喜欢','说“以后我们一起试试”']],
['第二幕 · 靠近','亲密关系最舒服的速度是？',['一步一步，有稳定的回应','经历波折后更坚定地靠近','暧昧里慢慢确认心意','各自前进，也不断会合']],
['第二幕 · 靠近','你喜欢的约会纪念方式是？',['把小票夹进共同的盒子','重走一段有故事的路','在照片背面写下当天的心情','给下一段旅程做一本计划册']],
['第二幕 · 靠近','如果周末只空出半天，你想？',['一起采购、做饭、散步','去完成一件一直没说出口的事','找个安静角落分享秘密','各带一本书去同一间咖啡馆']],
['第二幕 · 靠近','对方需要独处时，你更希望？',['约好稍后再聊，彼此放心','等情绪平静后认真说开','留一句温柔的暗号','尊重空间，也保留连接']],
['第二幕 · 靠近','你理想中的仪式感是？',['每年在同一天吃一顿家常饭','为重要时刻写一封信','在普通日子里突然送一朵花','一起解锁人生的新地图']],
['第二幕 · 靠近','你最喜欢哪种并肩画面？',['夜里并排洗碗','在人群里重新找到彼此','雨伞下悄悄靠近的肩膀','在各自目标旁写上对方名字']],
['第三幕 · 磨合','有了小误会，你最希望先发生什么？',['先确认彼此都还愿意好好聊','把真正介意的事说清楚','有人先轻轻打开话题','各自整理想法后一起找办法']],
['第三幕 · 磨合','一次争执后，什么会让你重新安心？',['如约而来的拥抱','具体而诚恳的道歉','一句“我其实一直在意你”','看见双方都愿意调整']],
['第三幕 · 磨合','若两人节奏暂时不同，你会选择？',['建立稳定的小约定','回头看清失去与珍惜','把未说出的心意讲明白','给彼此空间，再找共同方向']],
['第三幕 · 磨合','你最看重伴侣怎样支持你？',['在疲惫时给我一个落脚处','理解我曾经的伤口','看懂我没有说出的心情','相信我能成为更好的自己']],
['第三幕 · 磨合','面对不确定的未来，你更想听到？',['“我们先把今天过好。”','“这一次，我不会逃开。”','“我也和你想的一样。”','“变化来了，我们一起想办法。”']],
['第三幕 · 磨合','如果暂时分隔两地，你更需要？',['固定的晚安和重逢日期','一次坚定的承诺','分享细碎日常的消息','各自成长时仍为对方留位置']],
['尾声 · 以后','想象五年后的一个清晨，你看见？',['厨房里熟悉的背影','一张写满故事的旧照片','对视时仍会心动的笑','两份计划在同一张桌上']],
['尾声 · 以后','你想拥有哪种共同回忆？',['无数平凡日子的累积','走散后仍选择彼此的勇气','那些终于说出口的瞬间','一起跨过新关卡的经历']],
['尾声 · 以后','你希望家是什么感觉？',['随时能回去的灯光','允许脆弱与重新开始的地方','藏着只有两人懂的暗号','可以放下行李再出发的港湾']],
['尾声 · 以后','对方最让你心动的一句话是？',['“我给你留了位置。”','“我们重新写这一页。”','“原来你也喜欢我。”','“我们继续往前走。”']],
['尾声 · 以后','如果爱情是一种天气，你选？',['长久温暖的晴天','暴雨后透出的光','将落未落的春雨','有风但方向一致的晴空']],
['尾声 · 以后','你想怎样庆祝一个小小的胜利？',['在家开一瓶喜欢的饮料','去曾经跌倒的地方合照','写张只有对方看得懂的卡片','马上商量下一步的冒险']],
['尾声 · 以后','故事最后一镜，你希望是？',['两个人走进亮着灯的家','在旧地点握住新的手','终于没有错过的回头','镜头拉远，两人并肩向前']]
];
const weights=[[0,2,0,2,0,0,2],[2,0,2,0,0,1,0],[2,0,1,0,0,0,1],[0,1,0,0,2,2,0]];
const results=[
{name:'青梅竹马',line:'你要的不是惊天动地，是有人一直在。',role:'把陪伴写成承诺的人',portrait:'你珍惜熟悉感，也愿意在熟悉里持续发现新的心动。',why:'你偏爱有来有往的照顾、稳定的回应，以及能一起保存的小日子。',gift:'你能让关系中的细节慢慢长成信任。',egg:'“这条路我走过很多遍，和你一起走还是新鲜。”',acts:['初见：你们从同一条街的两个方向走来。','转折：长大的路上，各有忙碌，却总有人为对方留灯。','终幕：多年以后，熟悉的称呼变成最郑重的告白。'],target:[1,3,0,2,0,0,2]},
{name:'破镜重圆',line:'有些重逢，是两个更勇敢的人重新相爱。',role:'敢于重写结局的人',portrait:'你相信真诚的改变，也懂得故事的下一页需要新的行动。',why:'你对坦诚、修复与重新选择的画面有强烈共鸣。',gift:'你能从遗憾里读出成长，而不把过去当成终点。',egg:'“这一次，我们从好好说话开始。”',acts:['初见：两人在最熟悉的路口意外重逢。','转折：旧误会被认真摊开，新的边界也慢慢建立。','终幕：你们不重复过去，而是写出全新的以后。'],target:[1,0,3,0,1,2,0]},
{name:'双向暗恋',line:'原来每一次心跳，都有回声。',role:'把心事藏进细节的人',portrait:'你敏锐、温柔，喜欢那些只有彼此看得懂的小信号。',why:'你被含蓄的心动、细腻的回应和终于确认的瞬间打动。',gift:'你很会留意对方没说出口的快乐。',egg:'“我以为是巧合，后来发现你也在等我。”',acts:['初见：一次普通的擦肩，悄悄变成期待。','转折：两个人都怕打扰，却总在彼此需要时出现。','终幕：一张写错收件人的便签，说出了两份同样的喜欢。'],target:[3,0,1,0,0,0,1]},
{name:'并肩同行',line:'最好的浪漫，是我们都在奔向想去的地方。',role:'带着地图也带着勇气的人',portrait:'你看重平等、尊重和共同成长，愿意为彼此喝彩。',why:'你喜欢保有自己的方向，也期待有人一起面对新的挑战。',gift:'你能让爱成为支持，而不是束缚。',egg:'“你先走你的路，我会在下一站和你会合。”',acts:['初见：一次合作让你们看见彼此的光。','转折：两条道路出现分岔，你们学会商量新的交点。','终幕：各自完成心愿，也把共同的未来写进计划。'],target:[0,1,0,0,2,3,0]},
{name:'异地长跑',line:'距离有刻度，想念有归期。',role:'把远方走成约定的人',portrait:'你珍惜独立空间，也愿意用明确的约定维系亲近。',why:'你重视信任、持续沟通和一次次有日期的重逢。',gift:'你能把等待变成有温度的日常。',egg:'“今天的晚安，离见面又近了一天。”',acts:['初见：车窗两端的城市，留下同一张合照。','转折：时差和忙碌考验默契，你们为彼此留出固定时间。','终幕：终于在出站口，把屏幕里的拥抱变成真的。'],target:[1,2,0,1,2,1,1]},
{name:'救赎治愈',line:'因为被温柔看见，你又敢相信明天。',role:'懂得接住彼此的人',portrait:'你有细腻的同理心，重视被理解，也尊重彼此修复的节奏。',why:'你期待关系里可以坦诚脆弱，并用耐心一起向前。',gift:'你会在复杂情绪里，为对方留一处安心的位置。',egg:'“累了就坐一会儿，我陪你等天亮。”',acts:['初见：一句寻常的关心，让沉默有了出口。','转折：你们学着说出难处，也学习各自照顾自己。','终幕：没有谁替谁完成成长，却终于能并肩迎接晨光。'],target:[1,0,1,0,0,2,3]},
{name:'慢火日常',line:'爱是把普通的一天，过成值得收藏的一天。',role:'认真生活的共演者',portrait:'你喜欢不紧不慢的靠近，相信细水长流自有光芒。',why:'你对稳定节奏、家常陪伴和不张扬的仪式感最有共鸣。',gift:'你擅长在普通日子里制造轻盈的幸福感。',egg:'“今天也没什么特别的，除了和你一起。”',acts:['初见：你们从一顿并不特别的晚餐聊起。','转折：忙碌和琐碎到来，仍愿意认真听完彼此的一天。','终幕：窗边有两只杯子，故事就在每个明天继续。'],target:[0,2,0,3,0,0,2]}
];
const app=document.getElementById('app');let index=0,answers=[];
function home(){app.innerHTML='<div class="fade"><div class="eyebrow">一场关于心动的想象实验 · 电影开场</div><h1 class="hero">你的理想<br>恋爱剧本</h1><div class="rule"></div><p class="subtitle">如果你的爱情是一部电影，你想怎样相遇、靠近，又怎样走向以后？<br>25 个生活里的选择，写出属于你的三幕故事。</p><button class="button" id="start">开始放映　→</button><p class="footer">约 4 分钟 · 七种剧本结局<br>趣味恋爱想象测试，仅供娱乐；没有标准答案。</p></div>';document.getElementById('start').onclick=()=>{index=0;answers=[];render()}}
function render(){const q=questions[index];app.innerHTML='<div class="fade"><div class="top"><span>'+q[0]+'</span><span>'+(index+1)+' / '+questions.length+'</span></div><div class="track"><div class="bar" style="width:'+((index+1)/questions.length*100)+'%"></div></div><div class="eyebrow">镜头 '+String(index+1).padStart(2,'0')+' · 凭第一感觉选择</div><h1 class="question">'+q[1]+'</h1><div class="options">'+q[2].map((o,j)=>'<button class="option" data-choice="'+j+'"><span class="letter">'+('甲乙丙丁'[j])+'</span><span>'+o+'</span></button>').join('')+'</div><div class="nav"><button class="button secondary" id="back">← '+(index?'上一题':'返回首页')+'</button></div></div>';app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answers[index]=Number(b.dataset.choice);index++;if(index===questions.length)showResult();else render();window.scrollTo(0,0)});document.getElementById('back').onclick=()=>{if(index){index--;render()}else home()}}
function classify(a){const score=Array(7).fill(0);a.forEach((choice,i)=>{if(choice==null)return;weights[choice].forEach((n,k)=>score[k]+=n);if(i===17&&choice===3){score[4]+=2;score[6]+=1}if(i===12&&choice===1)score[5]+=1});const max=Math.max(...score,1);const norm=score.map(n=>n/max*3);return results.map((r,j)=>({j,value:r.target.reduce((sum,n,k)=>sum+Math.pow(norm[k]-n,2),0)})).sort((a,b)=>a.value-b.value||a.j-b.j)[0].j}
function showResult(){const r=results[classify(answers)];app.innerHTML='<article class="result fade"><div class="eyebrow">放映完毕 · 你的理想恋爱剧本</div><h1>'+r.name+'</h1><p class="tagline">“'+r.line+'”</p><hr><div class="section acts"><h2>三幕剧情</h2>'+r.acts.map(x=>'<p>'+x+'</p>').join('')+'</div><div class="section"><h2>你在剧本里的角色</h2><p>'+r.role+'</p></div><div class="section"><h2>性格画像</h2><p>'+r.portrait+'</p></div><div class="section"><h2>匹配理由</h2><p>'+r.why+'</p></div><div class="section"><h2>隐藏优势</h2><p>'+r.gift+'</p></div><hr><div class="section"><h2>片尾彩蛋 · 属于你的一句台词</h2><p class="line">“'+r.egg+'”</p></div><div class="actions"><button class="button" id="again">重新测试</button><p class="footer">截图保存这张竖版结果卡 · 分享你的故事<br>趣味想象测试，不构成情感建议。</p></div></article>';document.getElementById('again').onclick=()=>{home();window.scrollTo(0,0)}}home();
</script></body></html>
